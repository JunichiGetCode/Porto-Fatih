<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#aiBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#4c1d95" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect width="800" height="48" rx="16" fill="#1e1035" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <rect x="100" y="12" width="280" height="24" rx="6" fill="#2e1065" />
  <text x="116" y="28" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12">https://ai-interview-studio.platform</text>
  
  <!-- Left Side: Interactive Chat / Voice AI Wave -->
  <rect x="40" y="80" width="420" height="380" rx="16" fill="url(#glowCard)" stroke="#6b21a8" />
  <text x="65" y="120" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="700">AI Adaptive Speech &amp; Evaluation</text>
  <text x="65" y="145" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="13">Real-time dynamic LLM scoring &amp; speech synthesis</text>
  
  <!-- Chat bubbles -->
  <rect x="65" y="180" width="300" height="60" rx="14" fill="#3b0764" stroke="#7e22ce" />
  <text x="85" y="215" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="13">"Can you explain your approach to microservices?"</text>
  
  <rect x="135" y="260" width="300" height="60" rx="14" fill="#581c87" stroke="#a855f7" />
  <text x="155" y="295" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13">"I decouple services using async event buses..."</text>
  
  <!-- Audio Waveform -->
  <g transform="translate(65, 350)">
    <rect x="0" y="15" width="6" height="30" rx="3" fill="url(#purpleGrad)" />
    <rect x="15" y="5" width="6" height="50" rx="3" fill="url(#purpleGrad)" />
    <rect x="30" y="0" width="6" height="60" rx="3" fill="url(#purpleGrad)" />
    <rect x="45" y="10" width="6" height="40" rx="3" fill="url(#purpleGrad)" />
    <rect x="60" y="20" width="6" height="20" rx="3" fill="url(#purpleGrad)" />
    <rect x="75" y="5" width="6" height="50" rx="3" fill="url(#purpleGrad)" />
    <rect x="90" y="12" width="6" height="36" rx="3" fill="url(#purpleGrad)" />
    <rect x="105" y="2" width="6" height="56" rx="3" fill="url(#purpleGrad)" />
    <rect x="120" y="18" width="6" height="24" rx="3" fill="url(#purpleGrad)" />
    <text x="150" y="38" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">98.4% Confidence Score</text>
  </g>
  
  <!-- Right Side: Metrics Radar & Scores -->
  <rect x="480" y="80" width="280" height="380" rx="16" fill="url(#glowCard)" stroke="#6b21a8" />
  <text x="505" y="120" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Competency Breakdown</text>
  
  <!-- Progress Bars -->
  <g transform="translate(505, 150)">
    <text x="0" y="14" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12">System Architecture</text>
    <rect x="0" y="24" width="230" height="8" rx="4" fill="#3b0764" />
    <rect x="0" y="24" width="210" height="8" rx="4" fill="url(#purpleGrad)" />
  </g>
  <g transform="translate(505, 200)">
    <text x="0" y="14" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12">Problem Solving &amp; Logic</text>
    <rect x="0" y="24" width="230" height="8" rx="4" fill="#3b0764" />
    <rect x="0" y="24" width="195" height="8" rx="4" fill="url(#purpleGrad)" />
  </g>
  <g transform="translate(505, 250)">
    <text x="0" y="14" fill="#e9d5ff" font-family="-apple-system, sans-serif" font-size="12">Communication Clarity</text>
    <rect x="0" y="24" width="230" height="8" rx="4" fill="#3b0764" />
    <rect x="0" y="24" width="220" height="8" rx="4" fill="url(#purpleGrad)" />
  </g>
  
  <rect x="505" y="320" width="230" height="110" rx="12" fill="#3b0764" stroke="#7e22ce" />
  <text x="525" y="355" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">FEEDBACK SUMMARY</text>
  <text x="525" y="385" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">Advanced Pass • 94/100</text>
</svg>
