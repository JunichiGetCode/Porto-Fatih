<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="eventBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#eventBg)" />
  <rect x="1" y="1" width="798" height="498" rx="15" fill="none" stroke="#334155" stroke-width="2" />
  
  <!-- Header Bar -->
  <rect width="800" height="48" rx="16" fill="#090d16" />
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />
  <rect x="100" y="12" width="280" height="24" rx="6" fill="#1e293b" />
  <text x="116" y="28" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12">https://event-ticketing.global/portal</text>
  
  <!-- Main Ticket Mockup Center -->
  <g transform="translate(100, 90)">
    <!-- Ticket Left Body -->
    <rect width="400" height="340" rx="20" fill="#1e293b" stroke="#475569" />
    <text x="40" y="60" fill="#f43f5e" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1">TECH SUMMIT 2026</text>
    <text x="40" y="100" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">Global DevCon Keynote</text>
    <text x="40" y="130" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Main Stage Arena • Hall A • VIP Access</text>
    
    <g transform="translate(40, 170)">
      <text x="0" y="15" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">DATE &amp; TIME</text>
      <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Nov 28 • 09:00 AM</text>
    </g>
    <g transform="translate(220, 170)">
      <text x="0" y="15" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">GATE &amp; SEAT</text>
      <text x="0" y="38" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Gate 04 • Row A-12</text>
    </g>
    
    <!-- Verified Badge -->
    <rect x="40" y="250" width="160" height="40" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" />
    <text x="60" y="275" fill="#34d399" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">✓ QR CHECKED IN</text>
    
    <!-- Ticket Right Stub -->
    <line x1="400" y1="20" x2="400" y2="320" stroke="#0f172a" stroke-width="4" stroke-dasharray="10" />
    <rect x="400" y="0" width="200" height="340" rx="20" fill="#0f172a" stroke="#475569" />
    
    <!-- QR Code Mockup -->
    <rect x="440" y="50" width="120" height="120" rx="12" fill="#ffffff" />
    <rect x="455" y="65" width="28" height="28" fill="#000000" />
    <rect x="517" y="65" width="28" height="28" fill="#000000" />
    <rect x="455" y="127" width="28" height="28" fill="#000000" />
    <rect x="495" y="100" width="16" height="16" fill="#000000" />
    <rect x="520" y="130" width="18" height="18" fill="#000000" />
    
    <text x="445" y="210" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="12" text-anchor="middle">Scan for Fast-Pass</text>
    <rect x="430" y="240" width="140" height="50" rx="10" fill="url(#roseGrad)" />
    <text x="500" y="270" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Instant Check-in</text>
  </g>
</svg>
