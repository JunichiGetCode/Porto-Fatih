<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b" />
      <stop offset="50%" stop-color="#18132e" />
      <stop offset="100%" stop-color="#0c0a17" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#aiBg)" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="700" cy="100" r="150" fill="#8b5cf6" opacity="0.18" filter="url(#aiGlow)" />
  <circle cx="100" cy="380" r="160" fill="#06b6d4" opacity="0.14" filter="url(#aiGlow)" />

  <!-- Main UI Frame -->
  <rect x="90" y="65" width="620" height="370" rx="16" fill="#141124" stroke="rgba(139,92,246,0.3)" stroke-width="1.5" />
  
  <!-- Browser top bar -->
  <rect x="90" y="65" width="620" height="42" rx="16" fill="#0c0a17" />
  <rect x="90" y="91" width="620" height="16" fill="#0c0a17" />
  <line x1="90" y1="107" x2="710" y2="107" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="115" cy="86" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="130" cy="86" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="145" cy="86" r="5" fill="#10b981" opacity="0.8" />
  <rect x="170" y="77" width="280" height="18" rx="6" fill="#1b1730" />
  <text x="185" y="90" font-family="-apple-system, sans-serif" font-size="10" fill="#a78bfa">https://ai-interview.platform/session/live</text>

  <!-- Left: Real-time Audio Waveform & AI Interviewer -->
  <rect x="120" y="130" width="260" height="275" rx="12" fill="#1a1533" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  
  <!-- AI Avatar Circle -->
  <circle cx="250" cy="180" r="32" fill="url(#purpleGrad)" />
  <circle cx="250" cy="180" r="40" stroke="#a855f7" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M238 180 Q250 166 262 180" stroke="#ffffff" stroke-width="2" fill="none" />
  <text x="250" y="235" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Technical Interviewer</text>
  <text x="250" y="252" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">WebSocket Duplex Stream Active</text>

  <!-- Live Audio Waveform Bars -->
  <g transform="translate(145, 275)">
    <rect x="0" y="20" width="4" height="20" rx="2" fill="#06b6d4" />
    <rect x="10" y="10" width="4" height="40" rx="2" fill="#3b82f6" />
    <rect x="20" y="5" width="4" height="50" rx="2" fill="#8b5cf6" />
    <rect x="30" y="15" width="4" height="30" rx="2" fill="#a855f7" />
    <rect x="40" y="0" width="4" height="60" rx="2" fill="#06b6d4" />
    <rect x="50" y="8" width="4" height="44" rx="2" fill="#38bdf8" />
    <rect x="60" y="18" width="4" height="24" rx="2" fill="#818cf8" />
    <rect x="70" y="2" width="4" height="56" rx="2" fill="#c084fc" />
    <rect x="80" y="12" width="4" height="36" rx="2" fill="#a855f7" />
    <rect x="90" y="22" width="4" height="16" rx="2" fill="#06b6d4" />
    <rect x="100" y="5" width="4" height="50" rx="2" fill="#3b82f6" />
    <rect x="110" y="15" width="4" height="30" rx="2" fill="#8b5cf6" />
    <rect x="120" y="0" width="4" height="60" rx="2" fill="#c084fc" />
    <rect x="130" y="10" width="4" height="40" rx="2" fill="#38bdf8" />
    <rect x="140" y="20" width="4" height="20" rx="2" fill="#06b6d4" />
    <rect x="150" y="8" width="4" height="44" rx="2" fill="#818cf8" />
    <rect x="160" y="18" width="4" height="24" rx="2" fill="#a855f7" />
    <rect x="170" y="25" width="4" height="10" rx="2" fill="#06b6d4" />
    <rect x="180" y="12" width="4" height="36" rx="2" fill="#3b82f6" />
    <rect x="190" y="22" width="4" height="16" rx="2" fill="#8b5cf6" />
    <rect x="200" y="26" width="4" height="8" rx="2" fill="#06b6d4" />
  </g>

  <!-- Live Status Badge -->
  <rect x="180" y="360" width="140" height="26" rx="13" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1" />
  <circle cx="195" cy="373" r="4" fill="#22c55e" />
  <text x="206" y="377" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#4ade80">Audio Streaming</text>

  <!-- Right: Real-time Assessment & Code Challenge Scorecard -->
  <rect x="400" y="130" width="285" height="275" rx="12" fill="#1a1533" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <text x="420" y="160" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Assessment Matrix</text>
  <text x="420" y="176" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Product Engineer Benchmark</text>

  <!-- Score card 1: Technical Depth -->
  <rect x="420" y="195" width="245" height="52" rx="8" fill="#221c40" />
  <text x="435" y="215" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Technical Problem Solving</text>
  <text x="635" y="215" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">92%</text>
  <rect x="435" y="226" width="215" height="6" rx="3" fill="#2e2654" />
  <rect x="435" y="226" width="198" height="6" rx="3" fill="#38bdf8" />

  <!-- Score card 2: System Architecture -->
  <rect x="420" y="255" width="245" height="52" rx="8" fill="#221c40" />
  <text x="435" y="275" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">System Architecture &amp; Rails</text>
  <text x="635" y="275" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#a855f7">88%</text>
  <rect x="435" y="286" width="215" height="6" rx="3" fill="#2e2654" />
  <rect x="435" y="286" width="189" height="6" rx="3" fill="#a855f7" />

  <!-- Score card 3: Communication -->
  <rect x="420" y="315" width="245" height="52" rx="8" fill="#221c40" />
  <text x="435" y="335" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Clarity &amp; Communication</text>
  <text x="635" y="335" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#22c55e">95%</text>
  <rect x="435" y="346" width="215" height="6" rx="3" fill="#2e2654" />
  <rect x="435" y="346" width="204" height="6" rx="3" fill="#22c55e" />

  <!-- Bottom Brand info -->
  <g transform="translate(90, 460)">
    <text font-family="-apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff">AI Interview Platform</text>
    <text x="175" y="-1" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#a78bfa">• REACT 18 + TS + RUBY ON RAILS + WEBSOCKET + REDIS</text>
  </g>
</svg>
