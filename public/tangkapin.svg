<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b1d" />
      <stop offset="50%" stop-color="#0f2f33" />
      <stop offset="100%" stop-color="#051416" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#f58a5c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
  </g>

  <!-- Glowing Orbs -->
  <circle cx="680" cy="120" r="160" fill="#14b8a6" opacity="0.12" filter="url(#glow)" />
  <circle cx="150" cy="400" r="140" fill="#f97316" opacity="0.10" filter="url(#glow)" />

  <!-- Concentric Rings -->
  <circle cx="700" cy="100" r="220" stroke="#315257" stroke-width="1.5" fill="none" opacity="0.4" />
  <circle cx="700" cy="100" r="280" stroke="#315257" stroke-width="1" fill="none" opacity="0.25" />

  <!-- Center Card UI Frame Mockup -->
  <rect x="100" y="70" width="600" height="360" rx="16" fill="#102528" stroke="#315257" stroke-width="1.5" />
  
  <!-- Browser mockup bar -->
  <rect x="100" y="70" width="600" height="42" rx="16" fill="#0b1b1d" />
  <rect x="100" y="96" width="600" height="16" fill="#0b1b1d" />
  <line x1="100" y1="112" x2="700" y2="112" stroke="#315257" stroke-width="1" />
  <circle cx="125" cy="91" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="140" cy="91" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="155" cy="91" r="5" fill="#10b981" opacity="0.8" />
  <rect x="180" y="82" width="260" height="18" rx="6" fill="#16373b" />
  <text x="195" y="95" font-family="-apple-system, sans-serif" font-size="10" fill="#759397">https://tangkapin.id/marketplace</text>

  <!-- Mockup Content: Left Analytics Chart -->
  <rect x="130" y="140" width="250" height="250" rx="12" fill="#143438" stroke="#254b50" stroke-width="1" />
  <text x="150" y="170" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Dashboard Nelayan</text>
  <text x="150" y="188" font-family="-apple-system, sans-serif" font-size="10" fill="#759397">Tren Tangkapan &amp; Prediksi Panen</text>
  
  <!-- Mini Bar Chart -->
  <rect x="150" y="290" width="22" height="60" rx="4" fill="#14b8a6" />
  <rect x="180" y="260" width="22" height="90" rx="4" fill="#06b6d4" />
  <rect x="210" y="240" width="22" height="110" rx="4" fill="#f58a5c" />
  <rect x="240" y="220" width="22" height="130" rx="4" fill="#f97316" />
  <rect x="270" y="250" width="22" height="100" rx="4" fill="#14b8a6" />
  <rect x="300" y="210" width="22" height="140" rx="4" fill="#38bdf8" />
  <rect x="330" y="235" width="22" height="115" rx="4" fill="#2dd4bf" />
  <line x1="140" y1="355" x2="360" y2="355" stroke="#315257" stroke-width="1" />

  <!-- Mockup Content: Right Marketplace Panel -->
  <rect x="400" y="140" width="270" height="250" rx="12" fill="#143438" stroke="#254b50" stroke-width="1" />
  <text x="420" y="170" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Etalase Ikan Segar</text>
  <text x="420" y="188" font-family="-apple-system, sans-serif" font-size="10" fill="#759397">B2B / B2C Live Ordering</text>

  <!-- Product Item 1 -->
  <rect x="420" y="210" width="230" height="48" rx="8" fill="#1a4045" stroke="#254b50" stroke-width="1" />
  <circle cx="445" cy="234" r="14" fill="#0d9488" />
  <text x="470" y="228" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Ikan Tuna Sirip Kuning</text>
  <text x="470" y="244" font-family="-apple-system, sans-serif" font-size="10" fill="#f58a5c" font-weight="bold">Rp 65.000 / kg • Stok 120 kg</text>

  <!-- Product Item 2 -->
  <rect x="420" y="270" width="230" height="48" rx="8" fill="#1a4045" stroke="#254b50" stroke-width="1" />
  <circle cx="445" cy="294" r="14" fill="#0284c7" />
  <text x="470" y="288" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Ikan Kerapu Cantang</text>
  <text x="470" y="304" font-family="-apple-system, sans-serif" font-size="10" fill="#f58a5c" font-weight="bold">Rp 95.000 / kg • Stok 45 kg</text>

  <!-- Midtrans payment badge inside card -->
  <rect x="420" y="330" width="230" height="38" rx="8" fill="url(#orangeAccent)" />
  <text x="535" y="354" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Bayar Cepat via Midtrans Snap</text>

  <!-- Title Badge overlay at bottom left -->
  <g transform="translate(100, 445)">
    <text font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff">TangkapIN</text>
    <text x="105" y="-2" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#14b8a6">• VILT STACK (VUE + INERTIA + LARAVEL + POSTGRESQL)</text>
  </g>
</svg>
