<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="100%" height="100%" fill="none">
  <!-- ============================================== -->
  <!-- LEFT: NEO-BRUTALIST LOGO EMBLEM (50x50 at x=6, y=6) -->
  <!-- ============================================== -->
  <g transform="translate(2, 2)">
    <!-- Shadow Block -->
    <rect x="8" y="8" width="46" height="46" rx="4" fill="#000000" />
    <!-- Yellow Plate -->
    <rect x="4" y="4" width="46" height="46" rx="4" fill="#FFE600" stroke="#000000" stroke-width="2.5" />
    <!-- Header Strip -->
    <rect x="4" y="4" width="46" height="11" fill="#000000" />
    <circle cx="9" cy="9.5" r="1.8" fill="#FF3366" />
    <circle cx="14" cy="9.5" r="1.8" fill="#FFE600" />
    <circle cx="19" cy="9.5" r="1.8" fill="#00F08B" />

    <!-- Monogram F Shadow -->
    <path d="M 13 19 H 38 V 26 H 22 V 29 H 34 V 36 H 22 V 45 H 13 Z" fill="#000000" transform="translate(2, 2)" />
    <!-- Monogram F Body -->
    <path d="M 13 19 H 38 V 26 H 22 V 29 H 34 V 36 H 22 V 45 H 13 Z" fill="#00D2FF" stroke="#000000" stroke-width="2" />
    <!-- F Accents -->
    <rect x="22" y="19" width="16" height="7" fill="#00F08B" stroke="#000000" stroke-width="2" />
    <rect x="22" y="29" width="12" height="7" fill="#FF3366" stroke="#000000" stroke-width="2" />
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: NEO-BRUTALIST LOGOTYPE & IDENTITY       -->
  <!-- ============================================== -->
  <g transform="translate(68, 6)">
    <!-- FATIH Brand Title -->
    <text x="0" y="27" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="25" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">
      FATIH
    </text>

    <!-- .DEV Brutalist Stamp Box -->
    <g transform="translate(76, 7)">
      <rect x="2" y="2" width="60" height="22" fill="#000000" />
      <rect x="0" y="0" width="60" height="22" fill="#FFE600" stroke="#000000" stroke-width="2" />
      <text x="30" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="900" fill="#000000" letter-spacing="0.5">
        .DEV
      </text>
    </g>

    <!-- Subtitle: Full-Stack & 3D WebGL Strip -->
    <g transform="translate(0, 36)">
      <rect x="0" y="0" width="152" height="15" fill="#171720" stroke="#000000" stroke-width="1.5" />
      <text x="6" y="11" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#00F08B" letter-spacing="1">
        FULL-STACK // 3D POV
      </text>
    </g>

    <!-- Version Stamp -->
    <g transform="translate(158, 36)">
      <rect x="0" y="0" width="38" height="15" fill="#FF3366" stroke="#000000" stroke-width="1.5" />
      <text x="19" y="11" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">
        v2.5
      </text>
    </g>
  </g>
</svg>
