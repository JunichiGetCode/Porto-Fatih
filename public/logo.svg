<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="logoTopGrad" x1="12" y1="10" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="logoLeftGrad" x1="12" y1="20" x2="30" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="logoRightGrad" x1="30" y1="32" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="textGrad" x1="68" y1="24" x2="160" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="devGrad" x1="130" y1="24" x2="185" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- LEFT: 3D ISOMETRIC MONOGRAM ICON (Center: 30, 32) -->
  <!-- ============================================== -->
  <g transform="translate(2, 2)">
    <!-- Squircle Frame -->
    <rect x="4" y="4" width="52" height="52" rx="14" fill="#0b0f19" fill-opacity="0.9" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" />
    <rect x="5" y="5" width="50" height="50" rx="13" fill="none" stroke="url(#logoTopGrad)" stroke-width="0.8" stroke-opacity="0.4" />

    <!-- Isometric Cube Shadow -->
    <ellipse cx="30" cy="49" rx="16" ry="6" fill="#000000" fill-opacity="0.5" />

    <!-- 1. Top Rhombus Facet -->
    <path d="M30 14 L46 23 L30 32 L14 23 Z" fill="url(#logoTopGrad)" stroke="#cffafe" stroke-width="0.75" />
    <path d="M30 15 L43 23 L30 30 L17 23 Z" fill="#ffffff" fill-opacity="0.18" />

    <!-- 2. Left Facet ('F' Stem) -->
    <path d="M14 23 L30 32 L30 50 L14 41 Z" fill="url(#logoLeftGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.75" />
    <!-- F Upper Bar -->
    <path d="M17 27 L27 33 L27 36 L17 30 Z" fill="#ffffff" fill-opacity="0.95" />
    <!-- F Middle Bar -->
    <path d="M17 33 L24 37 L24 39.5 L17 35.5 Z" fill="#00f2fe" fill-opacity="0.9" />

    <!-- 3. Right Facet ('R' Arch & Kick) -->
    <path d="M30 32 L46 23 L46 41 L30 50 Z" fill="url(#logoRightGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.75" />
    <!-- R Arch -->
    <path d="M33 33 L43 27 L43 35 L33 41 Z" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <!-- R Dynamic Kick -->
    <path d="M36 39 L45 46" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" filter="url(#logoGlow)" />

    <!-- Quantum Core Node -->
    <circle cx="30" cy="32" r="3.2" fill="#00f2fe" filter="url(#logoGlow)" />
    <circle cx="30" cy="32" r="1.6" fill="#ffffff" />
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: BRAND TYPOGRAPHY & IDENTITY -->
  <!-- ============================================== -->
  <g transform="translate(70, 0)">
    <!-- Primary Logotype: Fatih.dev -->
    <text x="0" y="34" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">
      Fatih<tspan fill="url(#devGrad)">.dev</tspan>
    </text>

    <!-- Glowing Terminal Diode Dot -->
    <circle cx="118" cy="24" r="3" fill="#00f2fe" filter="url(#logoGlow)" />
    <circle cx="118" cy="24" r="1.5" fill="#ffffff" />

    <!-- Subtitle: Developer Specialty Tag -->
    <text x="1" y="49" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="8.5" font-weight="600" letter-spacing="1.8" fill="#94a3b8" text-transform="uppercase">
      Full-Stack &amp; 3D WebGL
    </text>

    <!-- Version Badge Tag -->
    <rect x="142" y="39" width="34" height="13" rx="3" fill="#1e1f2a" stroke="rgba(0, 242, 254, 0.3)" stroke-width="0.8" />
    <text x="147" y="48.5" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#00f2fe" letter-spacing="0.5">
      v2.4
    </text>
  </g>
</svg>
