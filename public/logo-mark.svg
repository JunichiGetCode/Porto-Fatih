<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- ============================================== -->
  <!-- NEO-BRUTALIST MONOGRAM MARK: FATIH.DEV         -->
  <!-- ============================================== -->

  <!-- 1. Hard Physical Block Drop Shadow (Pitch Black) -->
  <rect x="14" y="14" width="96" height="96" rx="6" fill="#000000" />

  <!-- 2. Main High-Voltage Canary Plate -->
  <rect x="8" y="8" width="96" height="96" rx="6" fill="#FFE600" stroke="#000000" stroke-width="4" stroke-linejoin="miter" />

  <!-- 3. Top Header Bar inside plate -->
  <rect x="8" y="8" width="96" height="20" rx="4" fill="#000000" />
  <!-- Corner Status Dots (Arcade style) -->
  <circle cx="18" cy="18" r="3" fill="#FF3366" />
  <circle cx="27" cy="18" r="3" fill="#FFE600" />
  <circle cx="36" cy="18" r="3" fill="#00F08B" />
  <text x="100" y="21" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#00D2FF" letter-spacing="1">
    [DEV::3D]
  </text>

  <!-- 4. Massive Geometric Monogram "F" with 3D Block Extrusion -->
  <!-- F Shadow Block -->
  <path d="M 28 36 H 78 V 50 H 46 V 56 H 70 V 70 H 46 V 90 H 28 Z" fill="#000000" transform="translate(4, 4)" />

  <!-- F Main Body: Stark Cyan -->
  <path d="M 28 36 H 78 V 50 H 46 V 56 H 70 V 70 H 46 V 90 H 28 Z" fill="#00D2FF" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />

  <!-- Top Bar High-Voltage Accent: Acid Lime -->
  <rect x="46" y="36" width="32" height="14" fill="#00F08B" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />

  <!-- Mid Bar Accent Notch: Punch Pink -->
  <rect x="46" y="56" width="24" height="14" fill="#FF3366" stroke="#000000" stroke-width="3.5" stroke-linejoin="miter" />

  <!-- 5. Interactive Pixel Node (Top Right) -->
  <rect x="84" y="46" width="12" height="12" fill="#000000" />
  <rect x="82" y="44" width="12" height="12" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" />
  <rect x="85" y="47" width="6" height="6" fill="#00F08B" />

  <!-- 6. Terminal Chevrons (Bottom Right) -->
  <path d="M 76 74 L 84 80 L 76 86" stroke="#000000" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />
  <rect x="88" y="83" width="8" height="3.5" fill="#000000" />
</svg>
