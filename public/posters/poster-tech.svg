<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="pTechBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pTechBg)" />
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#4c1d95" stroke-width="2" />
  
  <text x="60" y="90" fill="#f472b6" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="3">WEBGL &amp; 3D EXPERIENCES</text>
  <text x="60" y="140" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="36" font-weight="900">NEXT.JS 16 &amp;</text>
  <text x="60" y="185" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="36" font-weight="900">THREE.JS SUITE</text>
  
  <!-- Geometric 3D Hologram Cube Wireframe -->
  <g transform="translate(300, 420)">
    <!-- Outer Octagon -->
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="4" />
    <!-- Isometric Cube Wireframe -->
    <path d="M 0,-110 L 95,-55 L 95,55 L 0,110 L -95,55 L -95,-55 Z" fill="#2e1065" fill-opacity="0.5" stroke="#f472b6" stroke-width="3" />
    <line x1="0" y1="110" x2="0" y2="0" stroke="#38bdf8" stroke-width="3" />
    <line x1="-95" y1="-55" x2="0" y2="0" stroke="#38bdf8" stroke-width="3" />
    <line x1="95" y1="-55" x2="0" y2="0" stroke="#38bdf8" stroke-width="3" />
    
    <!-- Floating Center Core -->
    <circle cx="0" cy="0" r="24" fill="url(#neonGlow)" />
  </g>
  
  <g transform="translate(60, 670)">
    <text x="0" y="0" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">TURBOPACK • SHADERS • TAILWIND V4</text>
    <text x="0" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="15" font-weight="600">60 FPS Hardware-Accelerated 3D Virtual Suite</text>
