<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="pArchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#pArchBg)" />
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#334155" stroke-width="2" />
  
  <!-- Subtle Blueprint Grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="20" y1="200" x2="580" y2="200" />
    <line x1="20" y1="400" x2="580" y2="400" />
    <line x1="20" y1="600" x2="580" y2="600" />
    <line x1="200" y1="20" x2="200" y2="780" />
    <line x1="400" y1="20" x2="400" y2="780" />
  </g>
  
  <!-- Header -->
  <text x="60" y="90" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  <text x="60" y="140" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="900">CLEAN CODE &amp;</text>
  <text x="60" y="180" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="34" font-weight="900">DESIGN PATTERNS</text>
  
  <!-- Concentric Circles Diagram -->
  <circle cx="300" cy="430" r="190" fill="#0f172a" stroke="#475569" stroke-width="2" stroke-dasharray="6" />
  <circle cx="300" cy="430" r="140" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
  <circle cx="300" cy="430" r="90" fill="#312e81" stroke="#38bdf8" stroke-width="2" />
  <circle cx="300" cy="430" r="45" fill="url(#pArchGrad)" />
  
  <!-- Labels on Circles -->
  <text x="300" y="435" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ENTITIES</text>
  <text x="300" y="370" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">USE CASES</text>
  <text x="300" y="318" fill="#a5b4fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">CONTROLLERS &amp; REPOSITORIES</text>
  <text x="300" y="265" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">FRAMEWORKS &amp; DRIVERS</text>
  
  <!-- Footer Principles -->
  <g transform="translate(60, 680)">
    <text x="0" y="0" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">SOLID PRINCIPLES</text>
    <text x="0" y="24" fill="#cbd5e1" font-family="-apple-system, sans-serif" font-size="13">Decoupled Business Logic • High Cohesion • Testable</text>
    <text x="0" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Open Source Engineering Blueprint 2026</text>
  </g>
</svg>
